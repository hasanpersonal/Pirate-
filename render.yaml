# Render deploy config — static site served from public/
# Dashboard (New → Static Site): Publish Directory = public
# No catch-all rewrite: the game uses hash routing (#/page), so index.html
# is the only entry point and assets must be served as real files.
services:
  - type: web
    name: pirate-wars
    runtime: static
    buildCommand: ""
    staticPublishPath: public
