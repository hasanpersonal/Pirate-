# Render deploy config — static site served from public/
# In the Render dashboard (New → Static Site), make sure:
#   Publish Directory = public
# (or deploy via Blueprint and Render reads this file automatically)
services:
  - type: web
    name: pirate-wars
    runtime: static
    buildCommand: ""
    staticPublishPath: public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
